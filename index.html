<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoverCraft AI</title>
<style>
body{margin:0;padding:0;font-family:Arial,sans-serif;background:#f5f5f3;color:#1a1a1a}
.header{background:white;border-bottom:1px solid #e5e5e5;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:bold}
.badge{font-size:11px;background:#e8f5e9;color:#2e7d32;padding:4px 10px;border-radius:20px}
.container{max-width:720px;margin:40px auto;padding:0 20px}
.hero{text-align:center;margin-bottom:32px}
.hero h1{font-size:26px;font-weight:bold;margin-bottom:8px}
.hero p{font-size:15px;color:#666}
.card{background:white;border-radius:12px;border:1px solid #e5e5e5;padding:24px;margin-bottom:16px}
label{display:block;font-size:13px;font-weight:bold;color:#555;margin-bottom:8px;margin-top:16px}
textarea{width:100%;min-height:120px;font-size:14px;border:1px solid #ddd;border-radius:8px;padding:12px;resize:vertical;box-sizing:border-box;font-family:Arial,sans-serif}
input[type=password]{width:100%;font-size:13px;border:1px solid #ddd;border-radius:8px;padding:10px 12px;box-sizing:border-box}
.tone-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tone-btn{font-size:13px;padding:7px 16px;border:1px solid #ddd;border-radius:20px;background:white;color:#555;cursor:pointer}
.tone-btn.active{background:#1a1a1a;color:white;border-color:#1a1a1a}
.generate-btn{width:100%;padding:14px;font-size:15px;font-weight:bold;border:none;border-radius:10px;background:#1a1a1a;color:white;cursor:pointer;margin-top:16px}
.generate-btn:disabled{opacity:0.4;cursor:not-allowed}
.output-card{background:white;border-radius:12px;border:1px solid #e5e5e5;padding:24px;margin-top:16px;display:none}
.output-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.output-label{font-size:12px;font-weight:bold;color:#999;text-transform:uppercase}
.copy-btn{font-size:13px;padding:6px 14px;border:1px solid #ddd;border-radius:8px;background:white;color:#555;cursor:pointer}
.output-text{font-size:14px;line-height:1.8;color:#1a1a1a;white-space:pre-wrap}
.error-box{background:#fff5f5;border:1px solid #fed7d7;border-radius:8px;padding:12px 16px;color:#c53030;font-size:14px;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="header">
<div class="logo">✦ CoverCraft AI</div>
<div class="badge">AI-powered</div>
</div>
<div class="container">
<div class="hero">
<h1>Tailored cover letters in seconds</h1>
<p>Paste the job description and your background — get a professional cover letter instantly.</p>
</div>
<div class="card">
<label>Your OpenRouter API key</label>
<input type="password" id="apiKey" placeholder="sk-or-v1-...">
<label>Job description</label>
<textarea id="job" placeholder="Paste the full job posting here..."></textarea>
<label>Your resume / background</label>
<textarea id="resume" placeholder="Paste your resume, skills, or work history..."></textarea>
<label>Tone</label>
<div class="tone-row">
<button class="tone-btn active" data-tone="Professional">Professional</button>
<button class="tone-btn" data-tone="Enthusiastic">Enthusiastic</button>
<button class="tone-btn" data-tone="Concise">Concise</button>
</div>
<button class="generate-btn" id="genBtn" onclick="generate()">Generate cover letter</button>
</div>
<div class="error-box" id="errorBox"></div>
<div class="output-card" id="outputCard">
<div class="output-header">
<div class="output-label">Your cover letter</div>
<button class="copy-btn" onclick="copyText()">Copy</button>
</div><script>
var tone='Professional';
document.querySelectorAll('.tone-btn').forEach(function(btn){
btn.addEventListener('click',function(){
document.querySelectorAll('.tone-btn').forEach(function(b){b.classList.remove('active');});
btn.classList.add('active');
tone=btn.getAttribute('data-tone');
});
});
function generate(){
var apiKey=document.getElementById('apiKey').value.trim();
var job=document.getElementById('job').value.trim();
var resume=document.getElementById('resume').value.trim();
var errorBox=document.getElementById('errorBox');
errorBox.style.display='none';
if(!apiKey){showError('Please enter your OpenRouter API key.');return;}
if(!job){showError('Please paste the job description.');return;}
if(!resume){showError('Please paste your resume or background.');return;}
var btn=document.getElementById('genBtn');
btn.disabled=true;
btn.innerHTML='Writing your cover letter...';
document.getElementById('outputCard').style.display='none';
var prompt='Write a tailored cover letter. Tone: '+tone+'. 3-4 paragraphs, address to Hiring Manager, under 350 words. Output ONLY the cover letter.\n\nJOB:\n'+job+'\n\nCANDIDATE:\n'+resume;
fetch('https://openrouter.ai/api/v1/chat/completions',{
method:'POST',
headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey,'HTTP-Referer':window.location.href,'X-Title':'CoverCraft AI'},
body:JSON.stringify({model:'mistralai/mistral-7b-instruct:free',messages:[{role:'user',content:prompt}],max_tokens:800})
}).then(function(response){
return response.json().then(function(data){
if(!response.ok){showError('API error: '+(data.error&&data.error.message?data.error.message:'Check your API key.'));return;}
var text=data.choices[0].message.content.trim();
document.getElementById('outputText').textContent=text;
document.getElementById('outputCard').style.display='block';
document.getElementById('outputCard').scrollIntoView({behavior:'smooth'});
btn.disabled=false;
btn.innerHTML='Generate cover letter';
});
}).catch(function(){
showError('Network error. Try again.');
btn.disabled=false;
btn.innerHTML='Generate cove
<div class="output-text" id="outputText"></div>
</div>
</div>
